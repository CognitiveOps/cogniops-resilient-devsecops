name: Bug Report
description: Report a defect in the codebase or tooling.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please keep baseline components immutable for
        AI-driven changes — see `CONTRIBUTING.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: text
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - runtime-agent
        - design-agent
        - security-agent
        - evaluation
        - baseline
        - infrastructure
        - documentation
        - other
