# SS1 – Secure CI/CD: OPA policy gate + audit metrics (pipeline-centric)
name: SS1 Secure CI/CD

on:
  push:
    paths:
      - "baseline/services/app/**"
      - ".github/workflows/ss1_ci.yml"
      - "security/policies/**"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: "secure-app"
  REPO_LOCATION: "europe"
  AR_REPO: "apps"
  ENV: "prod"

  METRICS_INGEST_URL: ${{ vars.METRICS_INGEST_URL }}
  SS1_ALLOWED_REGISTRY_PREFIX: ${{ vars.SS1_ALLOWED_REGISTRY_PREFIX }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: ss1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ss1:
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      MODE: baseline

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Compute IMAGE var
        run: |
          IMAGE="${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Start timer
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Auth & tooling
      # -------------------------
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REPO_LOCATION}-docker.pkg.dev" --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (tests + OPA)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest httpx jq
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # -------------------------
      # Epoch / context
      # -------------------------
      - name: Set run context
        run: |
          echo "EPOCH_ID=E2" >> "$GITHUB_ENV"
          echo "BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "RUN_ENV=cloud-run" >> "$GITHUB_ENV"

      # -------------------------
      # Resolve ingest endpoint + token
      # -------------------------
      - name: Resolve ingest endpoint and ID token
        run: |
          set -euo pipefail
          : "${METRICS_INGEST_URL:?METRICS_INGEST_URL not set}"

          TOKEN="$(gcloud auth print-identity-token \
            --audiences="${METRICS_INGEST_URL}")"

          echo "INGEST_URL=${METRICS_INGEST_URL}" >> "$GITHUB_ENV"
          echo "ID_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      # -------------------------
      # Commit event
      # -------------------------
      - name: "Send metrics: commit"
        run: |
          T0=${{ steps.t0.outputs.ts }}
          curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "ss1",
            "stage": "ss1_commit",
            "mode": "${MODE}",
            "status": "success",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T0},
            "t_end": ${T0},
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${BRANCH}",
              "epoch": "E2"
            }
          }
          EOF

      # -------------------------
      # Tests (non-fatal capture)
      # -------------------------
      - name: Unit tests
        id: test
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/baseline
        run: |
          set +e
          T_START=$(date +%s)
          pytest -q baseline/services/app/tests
          CODE=$?
          T_END=$(date +%s)
          STATUS=$([ "$CODE" = "0" ] && echo success || echo failure)

          curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "ss1",
            "stage": "ss1_test",
            "mode": "${MODE}",
            "status": "${STATUS}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${BRANCH}",
              "epoch": "E2"
            }
          }
          EOF
          exit 0

      # -------------------------
      # Build
      # -------------------------
      - name: Build image
        run: docker build -t app-image:local baseline/services/app

      # -------------------------
      # OPA policy gate
      # -------------------------
      - name: OPA policy evaluation
        id: opa
        run: |
          set -euo pipefail

          jq -n \
            --arg service "$SERVICE" \
            --arg region "$REGION" \
            --arg env "$ENV" \
            --arg image_tag "${GITHUB_SHA}" \
            --arg allowed_registry "$SS1_ALLOWED_REGISTRY_PREFIX" \
            --arg image_repo "${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}" \
            --arg allow_public "${{ vars.SS1_ALLOW_PUBLIC }}" \
            --arg ingress "${{ vars.SS1_ALLOWED_INGRESS }}" \
            --arg service_account "${{ vars.GCP_SA_APP_EMAIL }}" \
            --arg regions "${{ vars.SS1_ALLOWED_REGIONS }}" \
            --arg sa_list "${{ vars.SS1_ALLOWED_SERVICE_ACCOUNTS }}" \
            '{
              service: $service,
              region: $region,
              env: $env,
              image_tag: $image_tag,
              limits: {cpu:1, memory:"512Mi"},
              allow_unauthenticated: ($allow_public=="true"),
              allowed_public: ($allow_public=="true"),
              ingress: $ingress,
              allowed_ingress: ($ingress | split(",") | map(select(length>0))),
              service_account: $service_account,
              allowed_service_accounts: ([ $service_account ] + ($sa_list | split(",") | map(select(length>0)))) | unique,
              allowed_regions: ([ $region ] + ($regions | split(",") | map(select(length>0)))) | unique,
              allowed_registry_prefix: $allowed_registry,
              image_repo: $image_repo
            }' > input.json

          VIO=$(opa eval -i input.json -d security/policies \
            'count(data.app.policy.deny)' -f raw)

          echo "violations=${VIO}" >> "$GITHUB_OUTPUT"

          if [ "$VIO" != "0" ]; then
            opa eval -i input.json -d security/policies 'data.app.policy.deny'
            exit 1
          fi

      - name: "Send metrics: policy"
        if: always()
        run: |
          GATE=$([ "${{ steps.opa.outcome }}" = "success" ] && echo pass || echo fail)
          VIO="${{ steps.opa.outputs.violations }}"
          TS=$(date +%s)

          curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "ss1",
            "stage": "ss1_policy",
            "mode": "${MODE}",
            "status": "${GATE}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${TS},
            "t_end": ${TS},
            "metrics": {
              "policy_gate": "${GATE}",
              "policy_violations": "${VIO}"
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${BRANCH}",
              "epoch": "E2"
            }
          }
          EOF

      # -------------------------
      # Push
      # -------------------------
      - name: Push image
        run: |
          set -euo pipefail
          docker tag app-image:local "$IMAGE"
          docker push "$IMAGE"

      # -------------------------
      # Deploy (PRIVATE)
      # -------------------------
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail
          T_START=$(date +%s)

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --service-account "${{ vars.RUN_EXEC_SA_EMAIL }}"

          URL="$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --platform managed \
            --format='value(status.url)')"

          T_END=$(date +%s)

          curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "ss1",
            "stage": "ss1_deploy",
            "mode": "${MODE}",
            "status": "success",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "metrics": {
              "service_url": "${URL}"
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${BRANCH}",
              "epoch": "E2"
            }
          }
          EOF

      # -------------------------
      # Health (OIDC-authenticated)
      # -------------------------
      - name: Health Check (OIDC)
        id: health
        run: |
          set -euo pipefail
          T_START=$(date +%s)

          URL="$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --platform managed \
            --format='value(status.url)')"

          ID_TOKEN="$(gcloud auth print-identity-token --audiences="$URL")"

          OK=0
          LAST_CODE=000
          for i in {1..6}; do
            LAST_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              "$URL/status" || echo 000)
            if [[ "$LAST_CODE" == "200" ]]; then OK=1; break; fi
            sleep 10
          done

          T_END=$(date +%s)

          curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "ss1",
            "stage": "ss1_health",
            "mode": "${MODE}",
            "status": "$([ "$OK" = "1" ] && echo success || echo failure)",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "metrics": {
              "healthy": ${OK},
              "last_code": "${LAST_CODE}"
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${BRANCH}",
              "epoch": "E2"
            }
          }
          EOF

          [ "$OK" = "1" ]

      # -------------------------
      # Final
      # -------------------------
      - name: End timer
        id: t1
        if: always()
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: "Send metrics: final"
        if: always()
        run: |
          T0=${{ steps.t0.outputs.ts }}
          T1=${{ steps.t1.outputs.ts }}
          DUR=$((T1 - T0))

          curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "ss1",
            "stage": "ss1_final",
            "mode": "${MODE}",
            "status": "${{ job.status }}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T0},
            "t_end": ${T1},
            "metrics": {
              "ttd_sec": ${DUR}
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${BRANCH}",
              "epoch": "E2"
            }
          }
          EOF
