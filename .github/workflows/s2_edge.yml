name: S2 Edge Deployment (OTA)

on:
  # 1) Τρέχει όταν ολοκληρώνεται το Terraform infra
  workflow_run:
    workflows: ["admin - Terraform Apply (GCP infra)"]
    types: [completed]

  # 2) Τρέχει όταν αλλάζει ο edge CV κώδικας ή το ίδιο το workflow
  push:
    paths:
      - "baseline/services/edge_cv_app/**"
      - ".github/workflows/s2_edge.yml"

  # 3) Manual run από Actions UI
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # απαραίτητο για WIF → GCP

concurrency:
  group: s2-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s2:
    runs-on: ubuntu-latest

    env:
      SCENARIO: s2
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # από repo variables (γράφονται από infra_apply)
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION:  ${{ vars.GCP_REGION }}
      AR_LOCATION: ${{ vars.GCP_REPO_LOCATION }}
      AR_REPO:     apps              # Artifact Registry repo name
      IMAGE_NAME:  edge-cv-app
      # URL του generic ingest CF (scenario-runs-ingest)
      METRICS_INGEST_URL: ${{ vars.SCENARIO_RUNS_INGEST_URL }}

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------
      # 0) Start overall S2 timer (για TTD_edge)
      # ------------------------------------------
      - name: Start timer
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 1) GCP OIDC AUTH (WIF, χωρίς static secrets)
      # ------------------------------------------
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker to Artifact Registry
        run: |
          set -euo pipefail
          AR_HOST="${AR_LOCATION}-docker.pkg.dev"
          echo "Configuring Docker for AR host: $AR_HOST"
          gcloud auth configure-docker "$AR_HOST" -q

      # ------------------------------------------
      # 2) Buildx multi-arch image
      # ------------------------------------------
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Compute image refs
        id: refs
        run: |
          set -euo pipefail

          echo "Using AR_LOCATION=${AR_LOCATION}"
          echo "Using GCP_PROJECT=${GCP_PROJECT}"
          echo "Using AR_REPO=${AR_REPO}"
          echo "Using IMAGE_NAME=${IMAGE_NAME}"

          AR_HOST="${AR_LOCATION}-docker.pkg.dev"
          IMAGE_REPO="${AR_HOST}/${GCP_PROJECT}/${AR_REPO}/${IMAGE_NAME}"
          IMAGE_TAG="${GITHUB_SHA}"

          echo "Full image repo: $IMAGE_REPO"
          echo "Tag: $IMAGE_TAG"

          echo "ar_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build & Push multi-arch to AR
        id: buildpush
        run: |
          set -euo pipefail

          IMG="${{ steps.refs.outputs.ar_repo }}:${{ steps.refs.outputs.tag }}"
          echo "Building image: $IMG"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "$IMG" \
            --push baseline/services/edge_cv_app

          echo "Inspecting manifest index for $IMG"

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y jq >/dev/null

          # Παίρνουμε το JSON του manifest index
          RAW_MANIFEST=$(docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}')
          echo "Manifest JSON:"
          echo "$RAW_MANIFEST" | jq '.'

          DIGEST=$(echo "$RAW_MANIFEST" | jq -r '.digest // empty')
          echo "Resolved digest: ${DIGEST:-<empty>}"

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Failed to resolve image digest for $IMG"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$IMG"    >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 3) Create OTA manifest (χωρίς security/PQC ακόμη)
      # ------------------------------------------
      - name: Create OTA manifest
        id: ota
        run: |
          set -euo pipefail

          mkdir -p baseline/metrics/s2/artifacts
          python baseline/scripts/make_ota_manifest.py \
            --image  "${{ steps.buildpush.outputs.image }}" \
            --digest "${{ steps.buildpush.outputs.digest }}" \
            --outdir baseline/metrics/s2/artifacts \
            --version "${{ steps.refs.outputs.tag }}"

          ls -la baseline/metrics/s2/artifacts
          echo "manifest=$(ls baseline/metrics/s2/artifacts/ota_*.json | tail -n1)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 4) Edge deploy simulation (runner) – μετράμε TDL
      # ------------------------------------------
      - name: Edge activate (sim)
        id: activate
        run: |
          set -euo pipefail

          MANIFEST_PATH="${{ steps.ota.outputs.manifest }}"
          MANIFEST_FILE="$(basename "$MANIFEST_PATH")"

          # Αντιγράφουμε το manifest δίπλα στο script
          cp "$MANIFEST_PATH" baseline/services/edge_cv_app/

          chmod +x baseline/services/edge_cv_app/edge_pull_and_activate.sh
          cd baseline/services/edge_cv_app

          # T0 = start of OTA activation (για TDL)
          T0=$(date +%s)
          ./edge_pull_and_activate.sh \
            "$MANIFEST_FILE" \
            "${{ env.GCP_REGION }}" "${{ env.GCP_PROJECT }}"
          # T1 = edge healthy (ή script exit)
          T1=$(date +%s)

          # pure OTA latency (TDL)
          echo "ota_latency=$((T1 - T0))" >> "$GITHUB_OUTPUT"
          # store start/end για τα metrics
          echo "t_ota_start=$T0" >> "$GITHUB_OUTPUT"
          echo "t_edge_end=$T1"  >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 5) Get ID token για το scenario-runs-ingest (IAM protected)
      #    Χρησιμοποιούμε impersonation του gha-app@... SA
      # ------------------------------------------
      - name: Get ID token for scenario-runs-ingest
        id: idtoken
        run: |
          set -euo pipefail

          echo "Getting ID token for ${METRICS_INGEST_URL} using SA: ${{ vars.GCP_SA_APP_EMAIL }}"

          TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.GCP_SA_APP_EMAIL }}" \
            --audiences="${METRICS_INGEST_URL}")

          if [ -z "${TOKEN}" ]; then
            echo "Failed to obtain identity token"
            exit 1
          fi

          echo "id_token=${TOKEN}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------
      # 6) Στέλνουμε S2 metrics στο BigQuery ingest (agent_metrics.runs)
      #    - s2_activate  → TDL (OTA latency)
      #    - s2_ttd_edge  → συνολικό S2 TTD_edge
      # ------------------------------------------
      - name: Send S2 metrics to BigQuery ingest
        run: |
          set -euo pipefail

          RUN_ID="${{ env.RUN_ID }}"
          COMMIT_SHA="${{ github.sha }}"
          SCENARIO_ID="${{ env.SCENARIO }}"
          MODE="baseline"
          STATUS="success"

          T0=${{ steps.t0.outputs.ts }}
          T_OTA_START=${{ steps.activate.outputs.t_ota_start }}
          T_EDGE_END=${{ steps.activate.outputs.t_edge_end }}
          TDL=${{ steps.activate.outputs.ota_latency }}
          ID_TOKEN="${{ steps.idtoken.outputs.id_token }}"

          echo "S2 metrics:"
          echo "  RUN_ID=$RUN_ID"
          echo "  COMMIT=$COMMIT_SHA"
          echo "  TDL=$TDL sec"
          echo "  T0=$T0, T_OTA_START=$T_OTA_START, T_EDGE_END=$T_EDGE_END"

          # 1) Event: s2_activate (TDL = OTA latency)
          curl -sS -X POST "$METRICS_INGEST_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -d @- <<EOF
          {
            "run_id": "$RUN_ID",
            "scenario_id": "$SCENARIO_ID",
            "stage": "s2_activate",
            "mode": "$MODE",
            "status": "$STATUS",
            "commit_sha": "$COMMIT_SHA",
            "t_start": $T_OTA_START,
            "t_end": $T_EDGE_END,
            "metrics": {
              "tdl_sec": $TDL
            },
            "labels": {
              "service": "edge_cv_app",
              "edge_device": "gh-runner"
            }
          }
          EOF

          # 2) Event: s2_ttd_edge (overall S2 pipeline start -> edge healthy)
          curl -sS -X POST "$METRICS_INGEST_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -d @- <<EOF
          {
            "run_id": "$RUN_ID",
            "scenario_id": "$SCENARIO_ID",
            "stage": "s2_ttd_edge",
            "mode": "$MODE",
            "status": "$STATUS",
            "commit_sha": "$COMMIT_SHA",
            "t_start": $T0,
            "t_end": $T_EDGE_END,
            "metrics": {
              "ttd_edge_source": "s2_pipeline"
            },
            "labels": {
              "service": "edge_cv_app",
              "edge_device": "gh-runner"
            }
          }
          EOF

      # ------------------------------------------
      # 7) Upload S2 artifacts (manifest, checksum)
      #    (optionally, for debugging & traceability)
      # ------------------------------------------
      - name: Upload S2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s2_${{ env.RUN_ID }}
          path: |
            baseline/metrics/s2/artifacts/ota_*.json
            baseline/metrics/s2/artifacts/ota_*.json.sha256
