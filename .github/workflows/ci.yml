name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile all Python modules
        run: python -m compileall runtime-agent design-agent security-agent evaluation functions baseline

  test:
    runs-on: ubuntu-latest
    needs: lint-and-compile
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Agent packages each define top-level `agent`/`models` packages, so they
      # must be tested from their own directories to avoid import collisions.
      - name: Run unit tests — runtime agent
        working-directory: runtime-agent
        run: pytest test_runtime -q

      - name: Run unit tests — design agent
        working-directory: design-agent
        run: pytest test_design -q

      - name: Run unit tests — security agent
        working-directory: security-agent
        run: pytest test_security -q

      - name: Run unit tests — evaluation framework
        working-directory: evaluation
        run: pytest test_evaluation -q

      - name: Run unit tests — baseline services
        run: pytest baseline/services/edge_cv_app/tests -q

      # Note: baseline/services/app/tests requires Docker and is run manually.

      - name: Run unit tests — ingest function
        run: pytest functions/ingest_runs -q
