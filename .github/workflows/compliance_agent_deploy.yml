name: Security Compliance Agent — Test, Build & Deploy

on:
    push:
        branches: [runtime_agent_dev, design_time_agent_dev, main]
        paths:
            - "security-agent/**"
            - "config/**"
            - ".github/workflows/compliance_agent_deploy.yml"
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    REGION: ${{ vars.GCP_REGION }}
    REPO_LOCATION: ${{ vars.GCP_REPO_LOCATION || 'europe' }}
    AR_REPO: "apps"
    SERVICE: "security-compliance-agent"

concurrency:
    group: compliance-agent-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ── Job 1: Run tests ──────────────────────────────────────────────
    test:
        runs-on: self-hosted
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install dependencies
              run: pip install -r security-agent/requirements.txt
            - name: Run tests
              run: cd security-agent && python -m pytest tests/ -v

    # ── Job 2: Build & Push container image ────────────────────────────
    build-push:
        needs: test
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        runs-on: self-hosted
        timeout-minutes: 15
        outputs:
            image: ${{ steps.meta.outputs.image }}
        steps:
            - uses: actions/checkout@v4

            - id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  service_account: ${{ vars.GCP_SA_APP_EMAIL }}
                  token_format: access_token

            - uses: docker/login-action@v3
              with:
                  registry: "${{ env.REPO_LOCATION }}-docker.pkg.dev"
                  username: oauth2accesstoken
                  password: ${{ steps.auth.outputs.access_token }}

            - id: meta
              run: |
                  IMAGE="${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA::8}"
                  echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

            - uses: docker/build-push-action@v6
              with:
                  context: security-agent
                  push: true
                  tags: ${{ steps.meta.outputs.image }}

    # ── Job 3: Deploy to Cloud Run ─────────────────────────────────────
    deploy:
        needs: build-push
        runs-on: self-hosted
        timeout-minutes: 10
        steps:
            - id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  service_account: ${{ vars.GCP_SA_APP_EMAIL }}

            - uses: google-github-actions/deploy-cloudrun@v2
              with:
                  service: ${{ env.SERVICE }}
                  region: ${{ env.REGION }}
                  image: ${{ needs.build-push.outputs.image }}
                  env_vars: |
                      COMMIT_SHA=${{ github.sha }}

    # ── Job 4: Smoke test ──────────────────────────────────────────────
    smoke-test:
        needs: deploy
        runs-on: self-hosted
        timeout-minutes: 5
        steps:
            - id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  service_account: ${{ vars.GCP_SA_APP_EMAIL }}

            - uses: google-github-actions/setup-gcloud@v3

            - name: Get service URL
              id: url
              run: |
                  URL=$(gcloud run services describe ${{ env.SERVICE }} \
                    --region ${{ env.REGION }} \
                    --format 'value(status.url)')
                  echo "url=$URL" >> "$GITHUB_OUTPUT"

            - name: Auth with ID token
              id: auth_id
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
                  service_account: ${{ vars.GCP_SA_APP_EMAIL }}
                  token_format: "id_token"
                  id_token_audience: ${{ steps.url.outputs.url }}
                  id_token_include_email: true

            - name: Health check
              run: |
                  TOKEN="${{ steps.auth_id.outputs.id_token }}"
                  URL="${{ steps.url.outputs.url }}/health"
                  echo "Token length: ${#TOKEN}"
                  echo "URL: $URL"
                  if [ -z "$TOKEN" ]; then
                    echo "ERROR: Token is empty!"
                    exit 1
                  fi
                  for i in 1 2 3 4 5; do
                    STATUS=$(curl -s -o /tmp/hc_body.txt -w '%{http_code}' \
                      -H "Authorization: Bearer $TOKEN" "$URL")
                    echo "Attempt $i — Health check: $STATUS"
                    cat /tmp/hc_body.txt && echo ""
                    [ "$STATUS" = "200" ] && exit 0
                    sleep 10
                  done
                  echo "Health check failed after 5 attempts"
                  exit 1

            - name: Agent info check
              run: |
                  TOKEN="${{ steps.auth_id.outputs.id_token }}"
                  curl -s -H "Authorization: Bearer $TOKEN" \
                    "${{ steps.url.outputs.url }}/agent/info" | python3 -c "
                  import json, sys
                  data = json.load(sys.stdin)
                  assert data['agent_name'] == 'cogniops_compliance_planner', f'Bad agent: {data}'
                  assert data['status'] == 'loaded', f'Not loaded: {data}'
                  print('Agent info OK:', json.dumps(data, indent=2))
                  "
