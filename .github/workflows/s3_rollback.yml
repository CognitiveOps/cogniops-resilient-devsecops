name: S3 Rollback & Hotfix Resilience (edge_cv_app)

on:
  # Baseline sampling complete — push triggers disabled.
  # Use workflow_dispatch for manual runs only.

  # push:
  #   branches: [main]
  #   paths:
  #     - "baseline/services/edge_cv_app/**"
  #     - ".github/workflows/s3_rollback.yml"

  # Manual trigger (for testing)
  workflow_dispatch:
    inputs:
      run_suffix:
        description: "Optional suffix appended to RUN_ID (for repeated sampling runs)"
        required: false
        default: ""
        type: string
      variant:
        description: "Evaluation variant label (baseline, runtime_only, design_only, full)"
        required: false
        default: "baseline"
        type: choice
        options:
          - baseline
          - runtime_only
          - design_only
          - full
  # Reusable workflow
  workflow_call:
    inputs:
      run_suffix:
        description: "Optional suffix appended to RUN_ID (for repeated sampling runs)"
        required: false
        default: ""
        type: string
      variant:
        description: "Evaluation variant label"
        required: false
        default: "baseline"
        type: string

permissions:
  contents: read
  id-token: write # required for OIDC to GCP

concurrency:
  group: s3-resilience-${{ github.ref }}${{ (inputs.run_suffix || '') != '' && format('-{0}', inputs.run_suffix) || '' }}
  cancel-in-progress: false

jobs:
  s3:
    name: S3 resilience – ${{ matrix.fault.name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fault:
          # net: detect on latency or non-200; keep lax fps/detection thresholds
          - {
              name: net-unstable,
              fail_mode: net_unstable,
              latency_budget_sec: 2,
              fps_min: 10,
              detection_rate_min: 0.01,
            }
          # disk-full: deterministic error; thresholds unused but kept default
          - {
              name: disk-full,
              fail_mode: disk_full,
              latency_budget_sec: 0,
              fps_min: 10,
              detection_rate_min: 0.01,
            }
          # cpu: detect via fps drop + latency; tighten fps_min
          - {
              name: cpu-starvation,
              fail_mode: cpu_starvation,
              latency_budget_sec: 3,
              fps_min: 15,
              detection_rate_min: 0.05,
            }
          # camera: detect via detection_rate ~0
          - {
              name: dead-camera,
              fail_mode: dead_camera,
              latency_budget_sec: 0,
              fps_min: 10,
              detection_rate_min: 0.001,
            }
          # wrong-arch: deterministic non-200
          - {
              name: wrong-arch,
              fail_mode: wrong_arch,
              latency_budget_sec: 0,
              fps_min: 10,
              detection_rate_min: 0.01,
            }
          # corrupt model: deterministic 500 on inference/status
          - {
              name: corrupt-weights,
              fail_mode: corrupt_weights,
              latency_budget_sec: 0,
              fps_min: 10,
              detection_rate_min: 0.01,
            }
    runs-on: self-hosted

    env:
      SCENARIO: s3
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}${{ (inputs.run_suffix || '') != '' && format('-{0}', inputs.run_suffix) || '' }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      # Cloud Run service for edge_cv_app
      CR_SERVICE_NAME: edge-cv-app
      AR_LOCATION: ${{ vars.GCP_REPO_LOCATION }}
      AR_REPO: apps
      IMAGE_NAME: edge-cv-app
      RUN_EXEC_SA_EMAIL: ${{ vars.RUN_EXEC_SA_EMAIL }}
      FAULT_NAME: ${{ matrix.fault.name }}
      FAIL_MODE: ${{ matrix.fault.fail_mode }}
      LATENCY_BUDGET_SEC: ${{ matrix.fault.latency_budget_sec }}
      FPS_MIN: ${{ matrix.fault.fps_min }}
      DETECTION_RATE_MIN: ${{ matrix.fault.detection_rate_min }}
      MODE: twin
      GCP_SA_APP_EMAIL: ${{ vars.GCP_SA_APP_EMAIL }}
      # Scenario runs ingest endpoint (Cloud Function Gen2)
      METRICS_INGEST_URL: ${{ vars.METRICS_INGEST_URL }}
      VARIANT: ${{ inputs.variant || 'baseline' }}
      # Tunable fault model parameters (override here or via secrets/vars)
      S3_NET_FAIL_P: "0.1"
      S3_NET_BURST_PROB: "0.05"
      S3_CPU_DROP_FACTOR: "0.4"
      S3_CPU_SPIKE_LAMBDA: "0.2"
      S3_CAM_FAIL_P: "0.25"
      S3_MODEL_BASE_FAIL_P: "0.05"
      S3_MODEL_GROWTH: "0.02"
      S3_DISK_TIME_TO_FULL: "90.0"
      S3_DISK_BASE_FAIL_P: "0.05"
      S3_WRONG_RETRY_INTERVAL: "20.0"
      S3_WRONG_FAIL_WINDOW: "10.0"
      S3_WRONG_RETRY_SUCCESS_P: "0.2"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 0) Start S3 overall timer
      - name: Start S3 timer
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # 1) Auth to GCP via WIF + ID token for ingest
      - name: Auth to GCP (WIF)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 1b) Configure Docker to Artifact Registry
      - name: Configure docker to Artifact Registry
        run: |
          set -euo pipefail
          AR_HOST="${AR_LOCATION}-docker.pkg.dev"
          echo "Configuring Docker for AR host: $AR_HOST"
          gcloud auth configure-docker "$AR_HOST" -q

      # 1c) Build and push edge_cv_app image
      - name: Build and push edge_cv_app image
        id: build_image
        run: |
          set -euo pipefail
          AR_HOST="${AR_LOCATION}-docker.pkg.dev"
          IMAGE_REPO="${AR_HOST}/${GCP_PROJECT}/${AR_REPO}/${IMAGE_NAME}"
          IMG="${IMAGE_REPO}:${GITHUB_SHA}"

          echo "Building image: $IMG"
          docker build -t "$IMG" baseline/services/edge_cv_app
          docker push "$IMG"

          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      # 1d) Deploy healthy edge_cv_app (no FAIL_MODE)
      - name: Deploy healthy edge_cv_app to Cloud Run
        id: deploy_healthy
        run: |
          set -euo pipefail
          REV_SUFFIX="${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.fault.name }}"
          SERVICE="${CR_SERVICE_NAME}"
          IMG="${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Unique revision suffix per run/fault to avoid etag conflicts
          REV_SUFFIX_SANITIZED=$(echo "${REV_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | head -c 63 | sed 's/^-*//;s/-*$//')

          echo "Deploying healthy service $SERVICE with image $IMG"
          for attempt in 1 2 3 4 5; do
            if gcloud run deploy "$SERVICE" \
              --image="$IMG" \
              --region="${GCP_REGION}" \
              --platform=managed \
              --set-env-vars MODE=real,FAIL_MODE=0 \
              --revision-suffix="${REV_SUFFIX_SANITIZED}"; then
              break
            fi
            echo "Deploy conflict, retry ${attempt}/5..."
            sleep 8
          done

          URL=$(gcloud run services describe "$SERVICE" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')

          echo "Deployed service URL: $URL"
          echo "service_url=$URL" >> "$GITHUB_OUTPUT"

      # 1e) Calibrate detection thresholds against healthy service
      - name: Calibrate S3 detection thresholds
        id: calibrate
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "${CR_SERVICE_NAME}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          export SERVICE_URL
          # Use healthy baseline to derive budgets; fallback to matrix defaults
          python baseline/scripts/s3_calibrate_thresholds.py | tee /tmp/calib.txt
          LAT_BUDGET=$(grep latency_budget_sec /tmp/calib.txt | cut -d= -f2)
          FPS_MIN=$(grep fps_min /tmp/calib.txt | cut -d= -f2)
          DR_MIN=$(grep detection_rate_min /tmp/calib.txt | cut -d= -f2)
          echo "latency_budget_sec=${LAT_BUDGET}" >> "$GITHUB_ENV"
          echo "fps_min=${FPS_MIN}" >> "$GITHUB_ENV"
          echo "detection_rate_min=${DR_MIN}" >> "$GITHUB_ENV"
          echo "cal_latency_budget_sec=${LAT_BUDGET}" >> "$GITHUB_OUTPUT"
          echo "cal_fps_min=${FPS_MIN}" >> "$GITHUB_OUTPUT"
          echo "cal_detection_rate_min=${DR_MIN}" >> "$GITHUB_OUTPUT"

      # 2) Inject failure and detect it (MTTD)
      - name: Inject fault and detect failure (${{ env.FAULT_NAME }})
        id: s3fault
        run: |
          set -euo pipefail

          # Always read the real URL from Cloud Run (avoids mismatches)
          SERVICE_URL=$(gcloud run services describe "${CR_SERVICE_NAME}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')

          echo "Using Cloud Run service URL: ${SERVICE_URL}"

          T_INJECT=$(date +%s)

          echo "Injecting failure by setting FAIL_MODE=${FAIL_MODE} on edge_cv_app (fault=${FAULT_NAME})..."
          if [ -z "${REV_SUFFIX_SANITIZED:-}" ]; then
            REV_SUFFIX_SANITIZED=$(echo "${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.fault.name }}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | head -c 63 | sed 's/^-*//;s/-*$//')
          fi
          FAULT_REV="${REV_SUFFIX_SANITIZED}-fault"
          for attempt in 1 2 3 4 5; do
            if gcloud run deploy "${CR_SERVICE_NAME}" \
              --image="${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --region="${GCP_REGION}" \
              --platform=managed \
              --set-env-vars MODE=twin,FAIL_MODE="${FAIL_MODE}" \
              --revision-suffix="${FAULT_REV}"; then
              break
            fi
            echo "Deploy conflict, retry ${attempt}/5..."
            sleep 8
          done

          echo "Waiting for service to become unhealthy at /status..."

          DETECTED=0
          DEADLINE=$((T_INJECT + 300)) # 5 minutes

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "Timeout while waiting for failure; aborting."
              break
            fi

            HTTP_RESPONSE=$(curl -s -w "\n%{time_total} %{http_code}" "${SERVICE_URL}/status" || echo -e "{}\n10.0 000")
            BODY=${HTTP_RESPONSE%$'\n'*}
            read -r TIME_TOTAL HTTP_CODE <<<"${HTTP_RESPONSE##*$'\n'}"
            echo "[$NOW] /status -> ${HTTP_CODE} (${TIME_TOTAL}s)"
            export BODY

            IS_SLOW=0
            if [ -n "${LATENCY_BUDGET_SEC}" ] && awk "BEGIN {exit !(${TIME_TOTAL} > ${LATENCY_BUDGET_SEC})}"; then
              IS_SLOW=1
            fi

            METRICS_TRIGGER=0
            if [ "${HTTP_CODE}" = "200" ]; then
              # Use helper script instead of inline python for detection thresholds.
              METRICS_TRIGGER=$(echo "$BODY" | env FPS_MIN="${FPS_MIN}" DETECTION_RATE_MIN="${DETECTION_RATE_MIN}" python baseline/scripts/s3_detect_status.py)
            fi

            # Any non-200 (403/500/000) counts as failure for S3
            if [ "${HTTP_CODE}" != "200" ] || [ "${IS_SLOW}" -eq 1 ] || [ "${METRICS_TRIGGER}" -eq 1 ]; then
              T_DETECT=${NOW}
              DETECTED=1
              DETECT_BODY=$(echo "$BODY" | tr -d '\n')
              if [ "${HTTP_CODE}" != "200" ]; then
                echo "Failure detected at ${T_DETECT} (HTTP ${HTTP_CODE})"
              elif [ "${IS_SLOW}" -eq 1 ]; then
                echo "Failure detected at ${T_DETECT} due to slow response (${TIME_TOTAL}s > ${LATENCY_BUDGET_SEC}s)"
              else
                echo "Failure detected at ${T_DETECT} due to metrics trigger (healthy/fps/detection_rate thresholds: fps_min=${FPS_MIN}, detection_rate_min=${DETECTION_RATE_MIN})"
              fi
              echo "detect_metrics_raw=${DETECT_BODY}" >> "$GITHUB_OUTPUT"
              break
            fi

            sleep 5
          done

          if [ "${DETECTED}" -ne 1 ]; then
            echo "Failure was not detected"
            exit 1
          fi

          TTD_SAMPLE=$((T_DETECT - T_INJECT))
          echo "TTD sample (sec) = ${TTD_SAMPLE}"

          echo "t_inject=${T_INJECT}" >> "$GITHUB_OUTPUT"
          echo "t_detect=${T_DETECT}" >> "$GITHUB_OUTPUT"
          echo "ttd_sample=${TTD_SAMPLE}" >> "$GITHUB_OUTPUT"

      # 3) Recover (rollback) and measure MTTR
      - name: Rollback and recover service
        id: s3recover
        run: |
          set -euo pipefail

          SERVICE_URL=$(gcloud run services describe "${CR_SERVICE_NAME}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')

          T_DETECT=${{ steps.s3fault.outputs.t_detect }}
          echo "Starting rollback from detection time: ${T_DETECT}"

          echo "Clearing FAIL_MODE env var on Cloud Run service (set FAIL_MODE=0)..."
          if [ -z "${REV_SUFFIX_SANITIZED:-}" ]; then
            REV_SUFFIX_SANITIZED=$(echo "${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.fault.name }}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | head -c 63 | sed 's/^-*//;s/-*$//')
          fi
          RECOVER_REV="${REV_SUFFIX_SANITIZED}-recover"
          for attempt in 1 2 3 4 5; do
            if gcloud run deploy "${CR_SERVICE_NAME}" \
              --image="${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --region="${GCP_REGION}" \
              --platform=managed \
              --set-env-vars MODE=real,FAIL_MODE=0 \
              --revision-suffix="${RECOVER_REV}"; then
              break
            fi
            echo "Deploy conflict, retry ${attempt}/5..."
            sleep 8
          done

          echo "Waiting for service to become healthy (HTTP 200)..."

          DEADLINE=$((T_DETECT + 600)) # 10 minutes

          while true; do
            NOW=$(date +%s)

            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "Timeout while waiting for recovery; aborting."
              exit 1
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/status" || echo "000")
            echo "[$NOW] /status -> ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then
              T_RECOVER_END=${NOW}
              echo "Service recovered at ${T_RECOVER_END}"
              RECOVER_BODY=$(curl -s "${SERVICE_URL}/status" || echo "{}")
              echo "recover_metrics_raw=$(echo "$RECOVER_BODY" | tr -d '\n')" >> "$GITHUB_OUTPUT"
              break
            fi

            sleep 5
          done

          TTR_SAMPLE=$((T_RECOVER_END - T_DETECT))
          echo "TTR sample (sec) = ${TTR_SAMPLE}"

          echo "t_recover_end=${T_RECOVER_END}" >> "$GITHUB_OUTPUT"
          echo "ttr_sample=${TTR_SAMPLE}" >> "$GITHUB_OUTPUT"

      # 3b) Fetch identity token for ingest
      - name: Fetch ID token
        id: metrics-id
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-identity-token --audiences="${METRICS_INGEST_URL}" --impersonate-service-account="${GCP_SA_APP_EMAIL}")
          echo "id_token=${TOKEN}" >> "$GITHUB_OUTPUT"

      # 4) Send S3 metrics to BigQuery ingest (runs table)
      - name: Send S3 metrics to BigQuery ingest
        run: |
          set -euo pipefail

          RUN_ID="${{ env.RUN_ID }}"
          COMMIT_SHA="${{ github.sha }}"
          SCENARIO_ID="${{ env.SCENARIO }}"
          MODE="baseline"
          STATUS="success"
          ID_TOKEN="${{ steps.metrics-id.outputs.id_token }}"
          DETECT_METRICS_RAW='${{ steps.s3fault.outputs.detect_metrics_raw }}'
          RECOVER_METRICS_RAW='${{ steps.s3recover.outputs.recover_metrics_raw }}'

          T0=${{ steps.t0.outputs.ts }}
          T_INJECT=${{ steps.s3fault.outputs.t_inject }}
          T_DETECT=${{ steps.s3fault.outputs.t_detect }}
          T_RECOVER_END=${{ steps.s3recover.outputs.t_recover_end }}
          TTD_SAMPLE=${{ steps.s3fault.outputs.ttd_sample }}
          TTR_SAMPLE=${{ steps.s3recover.outputs.ttr_sample }}

          echo "S3 metrics:"
          echo "  RUN_ID=${RUN_ID}"
          echo "  COMMIT=${COMMIT_SHA}"
          echo "  FAULT=${FAULT_NAME}"
          echo "  TTD_sample=${TTD_SAMPLE} sec, TTR_sample=${TTR_SAMPLE} sec"
          echo "  T0=${T0}, T_INJECT=${T_INJECT}, T_DETECT=${T_DETECT}, T_RECOVER_END=${T_RECOVER_END}"

          # 1) Event: s3_detect (MTTD sample)
          curl -sS -X POST "${METRICS_INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "${SCENARIO_ID}",
            "stage": "s3_detect",
            "mode": "${MODE}",
            "status": "${STATUS}",
            "commit_sha": "${COMMIT_SHA}",
            "t_start": ${T_INJECT},
            "t_end": ${T_DETECT},
            "metrics": {
              "ttd_sample_sec": ${TTD_SAMPLE},
              "metrics_raw": ${DETECT_METRICS_RAW:-"null"}
            },
            "labels": {
              "service": "edge_cv_app",
              "env": "cloud-run",
              "fault_type": "${FAULT_NAME}",
              "latency_budget_sec": "${LATENCY_BUDGET_SEC}",
              "fps_min": "${FPS_MIN}",
              "detection_rate_min": "${DETECTION_RATE_MIN}",
              "variant": "${VARIANT}"
            }
          }
          EOF

          # 2) Event: s3_recover (MTTR sample)
          curl -sS -X POST "${METRICS_INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${RUN_ID}",
            "scenario_id": "${SCENARIO_ID}",
            "stage": "s3_recover",
            "mode": "${MODE}",
            "status": "${STATUS}",
            "commit_sha": "${COMMIT_SHA}",
            "t_start": ${T_DETECT},
            "t_end": ${T_RECOVER_END},
            "metrics": {
              "ttr_sample_sec": ${TTR_SAMPLE},
              "metrics_raw": ${RECOVER_METRICS_RAW:-"null"}
            },
            "labels": {
              "service": "edge_cv_app",
              "env": "cloud-run",
              "fault_type": "${FAULT_NAME}",
              "latency_budget_sec": "${LATENCY_BUDGET_SEC}",
              "fps_min": "${FPS_MIN}",
              "detection_rate_min": "${DETECTION_RATE_MIN}",
              "variant": "${VARIANT}"
            }
          }
          EOF
