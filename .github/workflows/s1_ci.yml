# GitHub Actions workflow for the S1 CI/CD Baseline pipeline.
# Runs on pushes to baseline app files or when manually triggered.
name: S1 CI/CD Baseline

on:
  push:
    paths:
      - "baseline/services/app/**"
      - ".github/workflows/s1_ci.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "admin - Terraform Apply (GCP infra)"
    types: [completed]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: "baseline-app"
  REPO_LOCATION: "europe"
  AR_REPO: "apps"
  METRICS_INGEST_URL: ${{ vars.METRICS_INGEST_URL }}
  ENV: "prod"

permissions:
  id-token: write
  contents: read

jobs:
  build-test-push-deploy:
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start timer
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Auth to GCP (OIDC/WIF) as APP CI
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${REPO_LOCATION}-docker.pkg.dev --quiet

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx

      - name: Unit tests
        id: test
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/baseline
        run: |
          echo "t_test_start=$(date +%s)" >> "$GITHUB_OUTPUT"
          pytest -q baseline/services/app/tests
          echo "t_test_end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        run: |
          echo "t_build_start=$(date +%s)" >> "$GITHUB_OUTPUT"
          docker build -t app-image:local baseline/services/app
          echo "t_build_end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Push image to Artifact Registry
        id: push
        run: |
          echo "t_push_start=$(date +%s)" >> "$GITHUB_OUTPUT"
          IMAGE="${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${{ github.sha }}"
          docker tag app-image:local "$IMAGE"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "t_push_end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail
          echo "t_deploy_start=$(date +%s)" >> "$GITHUB_OUTPUT"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --platform managed \
            --memory 512Mi --cpu 1 \
            --min-instances 0 --max-instances 2
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')"
          : "${URL:?failed to resolve Cloud Run URL}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "t_deploy_end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloud Run to become healthy
        id: wait-healthy
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          echo "Deploy step URL (if any): ${DEPLOY_URL:-<empty>}"
          RESOLVED_URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')"
          : "${RESOLVED_URL:?could not determine Cloud Run URL from gcloud}"
          echo "Resolved URL via gcloud: ${RESOLVED_URL}"
          URL="$RESOLVED_URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Probing ${URL} ..."

          # 1) Wait for Ready=True
          for i in {1..120}; do
            READY="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed \
              --format="get(status.conditions[type=Ready].status)" 2>/dev/null || true)"
            [[ "$READY" == "True" ]] && break
            sleep 2
          done

          # Helper: HTTP status code, optionally with auth
          status_code() {
            local with_auth="${1:-false}"
            if [[ "$with_auth" == "true" ]]; then
              local token
              token="$(gcloud auth print-identity-token)"
              curl -Ls -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                --connect-timeout 5 --max-time 10 \
                --retry 3 --retry-delay 2 --retry-all-errors \
                "$URL" || echo 000
            else
              curl -Ls -o /dev/null -w '%{http_code}' \
                --connect-timeout 5 --max-time 10 \
                --retry 3 --retry-delay 2 --retry-all-errors \
                "$URL" || echo 000
            fi
          }

          # 2) Probe unauth first; if 401/403, switch to auth automatically
          USE_AUTH=false
          for i in {1..60}; do
            CODE="$(status_code "$USE_AUTH")"
            if [[ "$CODE" == "200" ]]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$CODE" == "401" || "$CODE" == "403" ]]; then
              USE_AUTH=true
            fi
            sleep $(( (i<10?i:10) ))  # mild backoff
          done

          # 3) Diagnostics (don’t fail if logging access missing)
          echo "::group::Cloud Run describe"
          gcloud run services describe "$SERVICE" --region "$REGION" --platform managed || true
          echo "::endgroup::"

          echo "::group::Recent revision logs"
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE}" \
            --project "$PROJECT_ID" --limit=100 --freshness=1h --format='value(textPayload)' || true
          echo "::endgroup::"

          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: End timer
        id: t1
        if: always()
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Record metrics (CSV baseline)
        run: |
          mkdir -p baseline/metrics
          python baseline/scripts/collect_metrics.py --commit "${{ github.sha }}" --stage "s1_ttd"   --status "${{ job.status }}" --tstart "${{ steps.t0.outputs.ts }}"           --tend "${{ steps.t1.outputs.ts }}"           --outfile baseline/metrics/s1_pipeline_runs.csv
          python baseline/scripts/collect_metrics.py --commit "${{ github.sha }}" --stage "s1_tests" --status "success"            --tstart "${{ steps.test.outputs.t_test_start }}" --tend "${{ steps.test.outputs.t_test_end }}" --outfile baseline/metrics/s1_pipeline_runs.csv
          python baseline/scripts/collect_metrics.py --commit "${{ github.sha }}" --stage "s1_build" --status "success"            --tstart "${{ steps.build.outputs.t_build_start }}" --tend "${{ steps.build.outputs.t_build_end }}" --outfile baseline/metrics/s1_pipeline_runs.csv
          python baseline/scripts/collect_metrics.py --commit "${{ github.sha }}" --stage "s1_push"  --status "success"            --tstart "${{ steps.push.outputs.t_push_start }}"   --tend "${{ steps.push.outputs.t_push_end }}"   --outfile baseline/metrics/s1_pipeline_runs.csv
          python baseline/scripts/collect_metrics.py --commit "${{ github.sha }}" --stage "s1_deploy" --status "${{ steps.wait-healthy.outcomes == 'success' && 'success' || 'failed' }}" --tstart "${{ steps.deploy.outputs.t_deploy_start }}" --tend "${{ steps.t1.outputs.ts }}" --outfile baseline/metrics/s1_pipeline_runs.csv

      - name: POST TTD to BigQuery ingest
        if: ${{ env.METRICS_INGEST_URL != '' }}
        run: |
          set -euo pipefail

          START_ISO=$(date -u -d "@${{ steps.t0.outputs.ts }}" +"%Y-%m-%dT%H:%M:%SZ")
          END_ISO=$(date -u -d "@${{ steps.t1.outputs.ts }}" +"%Y-%m-%dT%H:%M:%SZ")
          DUR=$(( ${{ steps.t1.outputs.ts }} - ${{ steps.t0.outputs.ts }} ))

          printf '{"run_id":"%s","commit_sha":"%s","started_at":"%s","ended_at":"%s","duration_sec":%s,"status":"%s","tests_total":1,"tests_failed":0,"service":"%s","env":"%s"}' \
            "${{ github.run_id }}" "${{ github.sha }}" "$START_ISO" "$END_ISO" "$DUR" "${{ job.status }}" "${SERVICE}" "${ENV}" > payload.json

          # Mint ID token using WIF impersonation
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.GCP_SA_APP_EMAIL }}" \
            --audiences="${METRICS_INGEST_URL}" \
            --format='get(token)')

          # POST metrics payload
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            --data-binary @payload.json \
            "${METRICS_INGEST_URL}"

      - name: Summary
        run: |
          DUR=$(( ${{ steps.t1.outputs.ts }} - ${{ steps.t0.outputs.ts }} ))
          URL="${{ steps.wait-healthy.outputs.url || steps.deploy.outputs.url }}"
          {
            echo "### S1 Baseline Run"
            echo "- Status: ${{ job.status }}"
            echo "- Service URL: ${URL}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Full TTD (sec): $DUR"
            echo "- Image: $IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: s1_pipeline_runs
          path: baseline/metrics/s1_pipeline_runs.csv
          if-no-files-found: ignore
