name: S1 CI/CD Baseline

on:
  # Trigger when app code or this workflow file changes
  push:
    paths:
      - "baseline/services/app/**"
      - ".github/workflows/s1_ci.yml"
  # Allow manual execution from the Actions UI
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    # Explicit permissions (required for GHCR push)
    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------
      # 1️⃣ Generate a temporary GitHub App token
      # ------------------------------------------
      - id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.APP_INSTALLATION_ID }}

      # ------------------------------------------
      # 2️⃣ Checkout repository using the App token
      # ------------------------------------------
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # ------------------------------------------
      # 3️⃣ Compute lowercase image tag for GHCR
      # ------------------------------------------
      - name: Set lowercase image name
        id: vars
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${repo_lower}/app:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "Using image: $IMAGE"

      # ------------------------------------------
      # 4️⃣ Start overall timer (for TTD metrics)
      # ------------------------------------------
      - name: Start timer
        id: t0
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      # ------------------------------------------
      # 5️⃣ Set up Docker Buildx
      # ------------------------------------------
      - uses: docker/setup-buildx-action@v3

      # ------------------------------------------
      # 6️⃣ Authenticate to GHCR using the App token
      # ------------------------------------------
      - name: Login to GHCR as App
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ steps.app-token.outputs.token }}

      # ------------------------------------------
      # 7️⃣ Build container image (context: baseline/services/app)
      # ------------------------------------------
      - name: Build image
        id: build
        run: |
          echo "t_build_start=$(date +%s)" >> $GITHUB_OUTPUT
          docker build -t "$IMAGE" baseline/services/app
          echo "t_build_end=$(date +%s)" >> $GITHUB_OUTPUT

      # ------------------------------------------
      # 8️⃣ Run unit tests (adds httpx dependency)
      # ------------------------------------------
      - name: Test service
        id: test
        run: |
          echo "t_test_start=$(date +%s)" >> $GITHUB_OUTPUT
          python -m pip install --upgrade pip
          # include httpx (required by Starlette TestClient)
          pip install fastapi uvicorn pytest requests httpx
          pytest -q baseline/services/app/tests
          echo "t_test_end=$(date +%s)" >> $GITHUB_OUTPUT

      # ------------------------------------------
      # 9️⃣ Push image to GHCR (App identity)
      # ------------------------------------------
      - name: Push image
        id: push
        run: |
          echo "t_push_start=$(date +%s)" >> $GITHUB_OUTPUT
          docker push "$IMAGE"
          echo "t_push_end=$(date +%s)" >> $GITHUB_OUTPUT

      # ------------------------------------------
      # 🔟 Record granular metrics (build/test/push durations)
      # ------------------------------------------
      - name: Record granular metrics
        run: |
          python baseline/scripts/collect_metrics.py --stage s1_build --status success \
            --start ${{ steps.build.outputs.t_build_start }} --commit ${{ github.sha }} \
            --outfile baseline/metrics/s1_s2_results.csv
          python baseline/scripts/collect_metrics.py --stage s1_test --status success \
            --start ${{ steps.test.outputs.t_test_start }} --commit ${{ github.sha }} \
            --outfile baseline/metrics/s1_s2_results.csv
          python baseline/scripts/collect_metrics.py --stage s1_push --status success \
            --start ${{ steps.push.outputs.t_push_start }} --commit ${{ github.sha }} \
            --outfile baseline/metrics/s1_s2_results.csv

      # ------------------------------------------
      # 11️⃣ Ephemeral staging health check
      # ------------------------------------------
      - name: Deploy to staging (ephemeral)
        run: |
          docker run -d -p 8080:8080 --name s1check "$IMAGE"
          for i in {1..20}; do
            curl -fsS http://localhost:8080/status && break || sleep 2
          done
          docker rm -f s1check

      # ------------------------------------------
      # 12️⃣ Record full TTD metric (Start → Healthy)
      # ------------------------------------------
      - name: Record S1 metrics (staging)
        run: |
          python baseline/scripts/collect_metrics.py \
            --stage s1_staging --status success \
            --start ${{ steps.t0.outputs.ts }} \
            --commit ${{ github.sha }} \
            --outfile baseline/metrics/s1_s2_results.csv

      # ------------------------------------------
      # 13️⃣ Upload metrics artifact (for analysis)
      # ------------------------------------------
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: s1_s2_results
          path: baseline/metrics/s1_s2_results.csv
