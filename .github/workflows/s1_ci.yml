# S1 CI/CD Baseline — Build → Test → Build Image → Push → Deploy → Health Check → Metrics
name: S1 CI/CD Baseline

on:
  push:
    paths:
      - "baseline/services/app/**"
      - ".github/workflows/s1_ci.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["admin - Terraform Apply (GCP infra)"]
    types: [completed]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: "baseline-app"
  REPO_LOCATION: "europe"      # region prefix (europe, us, asia)
  AR_REPO: "apps"
  METRICS_INGEST_URL: ${{ vars.METRICS_INGEST_URL }}
  ENV: "prod"

permissions:
  id-token: write
  contents: read
  actions: read   # needed for downloading artifacts from previous workflow runs

concurrency:
  group: s1-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-push-deploy:
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      # --- Source checkout ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Restore previous CSV history (artifact) ----------------------------
      # This makes CFR/DF lifetime-cumulative across runs
      - name: Restore previous metrics artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: s1_pipeline_runs                # must match the upload name below
          path: baseline/metrics/_restore
          if_no_artifact_found: ignore
          workflow: s1_ci.yml
          branch: ${{ github.ref_name }}

      # --- Compute image ref early (used throughout) --------------------------
      - name: Compute IMAGE var
        run: |
          IMAGE="$REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # --- Start global timer (TTD start) -------------------------------------
      - name: Start timer
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # --- Auth & toolchains --------------------------------------------------
      - name: Auth to GCP (OIDC/WIF) as APP CI
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REPO_LOCATION}-docker.pkg.dev" --quiet

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest httpx

      # --- Prepare metrics context (scenario/branch/env) ----------------------
      - name: Set run context (scenario/branch/env)
        run: |
          echo "SCENARIO_ID=S1" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "RUN_ENV=cloud-run" >> $GITHUB_ENV

      - name: Ensure metrics directory
        run: mkdir -p baseline/metrics

      # --- Metrics: commit (begin row; records commit_ts) ---------------------
      - name: "S1 metrics: commit"
        run: |
          python baseline/scripts/s1_write_metrics.py \
            --outfile baseline/metrics/s1_pipeline_runs.csv \
            --run_id "${{ github.run_id }}" \
            --commit_sha "${{ github.sha }}" \
            --stage commit \
            --scenario_id "${{ env.SCENARIO_ID }}" \
            --branch "${{ env.BRANCH }}" \
            --env "${{ env.RUN_ENV }}"

      # --- Unit tests (non-fatal capture) -------------------------------------
      - name: Unit tests (capture exit code)
        id: test
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/baseline
        run: |
          set +e
          pytest -q baseline/services/app/tests
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "S1 metrics: test status"
        if: always()
        run: |
          STATUS=$([ "${{ steps.test.outputs.code }}" = "0" ] && echo success || echo failure)
          python baseline/scripts/s1_write_metrics.py \
            --outfile baseline/metrics/s1_pipeline_runs.csv \
            --run_id "${{ github.run_id }}" \
            --commit_sha "${{ github.sha }}" \
            --stage test \
            --status "$STATUS" \
            --scenario_id "${{ env.SCENARIO_ID }}" \
            --branch "${{ env.BRANCH }}" \
            --env "${{ env.RUN_ENV }}"

      # --- Build & Push -------------------------------------------------------
      - name: Build image
        id: build
        run: |
          set -euo pipefail
          docker build -t app-image:local baseline/services/app

      - name: Push image
        id: push
        run: |
          set -euo pipefail
          docker tag app-image:local "$IMAGE"
          docker push "$IMAGE"
          DIGEST=$(gcloud artifacts docker images list \
            "$REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE" \
            --include-tags --format='get(DIGEST)' --filter="TAGS:${GITHUB_SHA}" | head -n1)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: "S1 metrics: push (image ref)"
        run: |
          python baseline/scripts/s1_write_metrics.py \
            --outfile baseline/metrics/s1_pipeline_runs.csv \
            --run_id "${{ github.run_id }}" \
            --commit_sha "${{ github.sha }}" \
            --stage push \
            --image "${IMAGE}@${DIGEST}" \
            --scenario_id "${{ env.SCENARIO_ID }}" \
            --branch "${{ env.BRANCH }}" \
            --env "${{ env.RUN_ENV }}"

      # --- Deploy to Cloud Run ------------------------------------------------
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --platform managed \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')"
          : "${URL:?failed to resolve Cloud Run URL}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: "S1 metrics: deploy"
        run: |
          python baseline/scripts/s1_write_metrics.py \
            --outfile baseline/metrics/s1_pipeline_runs.csv \
            --run_id "${{ github.run_id }}" \
            --commit_sha "${{ github.sha }}" \
            --stage deploy \
            --scenario_id "${{ env.SCENARIO_ID }}" \
            --branch "${{ env.BRANCH }}" \
            --env "${{ env.RUN_ENV }}"

      # --- Health check (retry/backoff) ---------------------------------------
      - name: Health Check (with retries)
        id: health_check
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')"
          : "${URL:?Could not resolve Cloud Run URL}"
          OK=0
          for i in {1..6}; do
            CODE=$(curl -Ls -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$URL" || echo 000)
            if [[ "$CODE" == "200" ]]; then OK=1; break; fi
            sleep 10
          done
          echo "healthy=$OK" >> "$GITHUB_OUTPUT"
          if [[ "$OK" != "1" ]]; then exit 1; fi

      # --- End timer (TTD end) ------------------------------------------------
      - name: End timer
        id: t1
        if: always()
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # --- Finalize metrics (health stage writes overall status) --------------
      - name: "S1 metrics: health (final)"
        if: always()
        run: |
          python baseline/scripts/s1_write_metrics.py \
            --outfile baseline/metrics/s1_pipeline_runs.csv \
            --run_id "${{ github.run_id }}" \
            --commit_sha "${{ github.sha }}" \
            --stage health \
            --status "${{ job.status }}" \
            --scenario_id "${{ env.SCENARIO_ID }}" \
            --branch "${{ env.BRANCH }}" \
            --env "${{ env.RUN_ENV }}"

      # --- Optional: POST TTD to external ingest ------------------------------
      - name: POST metrics to BigQuery ingest (unified history)
        if: ${{ env.METRICS_INGEST_URL != '' }}
        run: |
          set -euo pipefail
          START_ISO=$(date -u -d "@${{ steps.t0.outputs.ts }}" +"%Y-%m-%dT%H:%M:%SZ")
          END_ISO=$(date -u -d "@${{ steps.t1.outputs.ts }}" +"%Y-%m-%dT%H:%M:%SZ")
          DUR=$(( ${{ steps.t1.outputs.ts }} - ${{ steps.t0.outputs.ts }} ))

          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg scenario "S1" \
            --arg branch "${{ github.ref_name }}" \
            --arg env "${{ env.ENV }}" \
            --arg service "${{ env.SERVICE }}" \
            --arg start "$START_ISO" \
            --arg end "$END_ISO" \
            --arg status "${{ job.status }}" \
            --argjson ttd "$DUR" \
            '{
              run_id: $run_id,
              commit_sha: $sha,
              scenario_id: $scenario,
              branch: $branch,
              env: $env,
              service: $service,
              started_at: $start,
              ended_at: $end,
              duration_sec: $ttd,
              status: $status,
              tests_total: 1,
              tests_failed: ( if $status == "success" then 0 else 1 end )
            }' > payload.json

          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="gha-app@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --audiences="${METRICS_INGEST_URL}" \
            --format='get(token)')

          curl -sS -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${METRICS_INGEST_URL}"

      # --- Snapshot for the thesis (lifetime & per-scenario) ------------------
      - name: Build baseline snapshot (history-based)
        if: always()
        run: |
          python baseline/scripts/metrics_snapshot.py \
            --in baseline/metrics/s1_pipeline_runs.csv \
            --merge-from "baseline/metrics/_restore/**/s1_pipeline_runs.csv" \
            --write-merged-to baseline/metrics/s1_pipeline_runs.csv \
            --out baseline/metrics/s1_baseline_snapshot.json \
            --group-by scenario \
            --scenario-default S1 \
            --min-days 1.0


      - name: Upload S1 baseline snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1_baseline_snapshot
          path: baseline/metrics/s1_baseline_snapshot.json
          if-no-files-found: error

      # --- Render CFR/DF from the snapshot (no duplicate math) ----------------
      - name: Render CFR/DF from snapshot
        if: always()
        run: |
          FILE="baseline/metrics/s1_baseline_snapshot.json"
          if [ ! -f "$FILE" ]; then
            echo "**Snapshot not found at $FILE**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          L_CFR=$(jq -r '.lifetime.cfr' "$FILE")
          L_DF=$(jq -r '.lifetime.df_per_day' "$FILE")
          L_DAYS=$(jq -r '.lifetime.days' "$FILE")

          {
            echo "### CFR/DF — lifetime & per-scenario (from snapshot)"
            echo "- **Lifetime CFR:** ${L_CFR}%"
            if [ "$L_DAYS" != "0" ]; then
              printf -- "- **Lifetime DF:** %.2f successful deployments/day (duration≈%.2f days)\n" "$L_DF" "$L_DAYS"
            else
              echo "- **Lifetime DF:** n/a (insufficient timestamps)"
            fi
            # Per-scenario lines
            jq -r '
              .per_scenario
              | to_entries
              | sort_by(.key)
              | .[]
              | "- **Scenario \(.key):** CFR \(.value.cfr)% (total=\(.value.total_runs), fail=\(.value.fail), success=\(.value.success))"
                + (if (.value.days|tonumber) > 0
                  then ", DF \(.value.df_per_day)/day over ≈\(.value.days) days"
                  else ", DF n/a (insufficient timestamps)"
                  end)
            ' "$FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Summary (human-readable headline in the Job UI) --------------------
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          DUR=$(( ${{ steps.t1.outputs.ts }} - ${{ steps.t0.outputs.ts }} ))
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')" || URL="<unknown>"
          {
            echo "### S1 Baseline Run"
            echo "- Status: ${{ job.status }}"
            echo "- Service URL: ${URL}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Full TTD (sec): $DUR"
            echo "- Image: $IMAGE"
            echo "- Health: ${{ steps.health_check.outputs.healthy || '<n/a>' }}"
            echo "- Scenario: ${{ env.SCENARIO_ID }} | Branch: ${{ env.BRANCH }} | Env: ${{ env.RUN_ENV }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Upload metrics artifact (CSV) --------------------------------------
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1_pipeline_runs
          path: baseline/metrics/s1_pipeline_runs.csv
          if-no-files-found: ignore
