# S1 CI/CD Baseline — Build → Test → Build Image → Push → Deploy → Finalize Metrics
name: S1 CI/CD Baseline

on:
  # Baseline sampling complete — removed workflow_run trigger on infra_apply
  # to prevent Phase 0+ infra changes from cascading into baseline runs.
  # Use workflow_dispatch or schedulers for any future baseline runs.

  # Run automatically on app code changes
  push:
    paths:
      - "baseline/services/app/**"
      - ".github/workflows/s1_ci.yml"

  # Optional: manual runs
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: "baseline-app"
  REPO_LOCATION: "europe"      # region prefix (europe, us, asia)
  AR_REPO: "apps"
  METRICS_INGEST_URL: ${{ vars.METRICS_INGEST_URL }}
  ENV: "prod"

permissions:
  id-token: write
  contents: read

concurrency:
  group: s1-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-push-deploy:
    # Only run if WIF is configured
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      MODE: baseline

    defaults:
      run:
        shell: bash

    steps:
      # --- Source checkout ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Compute image ref early (used throughout) --------------------------
      - name: Compute IMAGE var
        run: |
          IMAGE="$REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # --- Start global timer (TTD start) -------------------------------------
      - name: Start timer
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # --- Auth & toolchains --------------------------------------------------
      - name: Auth to GCP (OIDC/WIF) as APP CI
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REPO_LOCATION}-docker.pkg.dev" --quiet

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest httpx requests

      # --- Prepare metrics context (scenario/branch/env) ----------------------
      - name: Set run context (scenario/branch/env) 
        run: |
          echo "SCENARIO_ID=S1" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "RUN_ENV=cloud-run" >> $GITHUB_ENV

      # --- Resolve ingest endpoint + ID token ---------------------------------
      - name: Resolve ingest endpoint and ID token
        id: ingest
        run: |
          set -euo pipefail
          INGEST_URL="${METRICS_INGEST_URL:-}"
          if [ -z "$INGEST_URL" ]; then
            echo "Ingest URL not configured (METRICS_INGEST_URL)." >&2
            exit 1
          fi
          TOKEN=$(gcloud auth print-identity-token \
            --audiences="$INGEST_URL" \
            --impersonate-service-account="${{ vars.GCP_SA_APP_EMAIL }}")
          echo "INGEST_URL=$INGEST_URL" >> "$GITHUB_ENV"
          echo "ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "ingest_url=$INGEST_URL" >> "$GITHUB_OUTPUT"

      # --- Metrics: commit (event) --------------------------------------------
      - name: "Send metrics: commit"
        run: |
          set -euo pipefail
          T0=${{ steps.t0.outputs.ts }}
          curl -sS -X POST "${INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${{ env.RUN_ID }}",
            "scenario_id": "s1",
            "stage": "s1_commit",
            "mode": "${{ env.MODE }}",
            "status": "success",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T0},
            "t_end": ${T0},
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${{ github.ref_name }}"
            }
          }
          EOF

      # --- Unit tests (non-fatal capture) -------------------------------------
      - name: Unit tests (capture exit code)
        id: test
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/baseline
        run: |
          set +e
          T_START=$(date +%s)
          pytest -q baseline/services/app/tests
          CODE=$?
          T_END=$(date +%s)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          STATUS=$([ "$CODE" = "0" ] && echo success || echo failure)
          curl -sS -X POST "${INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${{ env.RUN_ID }}",
            "scenario_id": "s1",
            "stage": "s1_test",
            "mode": "${{ env.MODE }}",
            "status": "${STATUS}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${{ github.ref_name }}"
            }
          }
          EOF
          exit 0

      # --- Build & Push -------------------------------------------------------
      - name: Build image
        id: build
        run: |
          set -euo pipefail
          docker build -t app-image:local baseline/services/app

      - name: Push image
        id: push
        run: |
          set +e
          T_START=$(date +%s)
          docker tag app-image:local "$IMAGE"
          docker push "$IMAGE"
          PUSH_STATUS=$?
          DIGEST=""
          DIG_STATUS=0
          if [ "$PUSH_STATUS" = "0" ]; then
            DIGEST=$(gcloud artifacts docker images list \
              "$REPO_LOCATION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE" \
              --include-tags --format='get(DIGEST)' --filter="TAGS:${GITHUB_SHA}" | head -n1)
            echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
            DIG_STATUS=$?
          fi
          CODE=$PUSH_STATUS
          if [ "$DIG_STATUS" != "0" ]; then CODE=$DIG_STATUS; fi
          T_END=$(date +%s)
          STATUS=$([ "$CODE" = "0" ] && echo success || echo failure)
          DIG="${DIGEST:-""}"
          curl -sS -X POST "${INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${{ env.RUN_ID }}",
            "scenario_id": "s1",
            "stage": "s1_push",
            "mode": "${{ env.MODE }}",
            "status": "${STATUS}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "metrics": {
              "digest": "${DIG}"
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${{ github.ref_name }}",
              "image": "${IMAGE}"
            }
          }
          EOF
          exit $CODE

      # --- Deploy to Cloud Run ------------------------------------------------
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set +e
          T_START=$(date +%s)
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --platform managed \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2
          DEPLOY_STATUS=$?
          URL=""
          if [ "$DEPLOY_STATUS" = "0" ]; then
            URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')"
            : "${URL:?failed to resolve Cloud Run URL}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi
          CODE=$DEPLOY_STATUS
          T_END=$(date +%s)
          STATUS=$([ "$CODE" = "0" ] && echo success || echo failure)
          curl -sS -X POST "${INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${{ env.RUN_ID }}",
            "scenario_id": "s1",
            "stage": "s1_deploy",
            "mode": "${{ env.MODE }}",
            "status": "${STATUS}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${{ github.ref_name }}"
            },
            "metrics": {
              "service_url": "${URL:-}"
            }
          }
          EOF
          exit $CODE

      # --- Health check (retry/backoff) ---------------------------------------
      - name: Health Check (with retries)
        id: health_check
        run: |
          set +e
          T_START=$(date +%s)
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')"
          : "${URL:?Could not resolve Cloud Run URL}"
          OK=0
          LAST_CODE=000
          for i in {1..6}; do
            LAST_CODE=$(curl -Ls -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$URL" || echo 000)
            if [[ "$LAST_CODE" == "200" ]]; then OK=1; break; fi
            sleep 10
          done
          T_END=$(date +%s)
          echo "healthy=$OK" >> "$GITHUB_OUTPUT"
          STATUS=$([ "$OK" = "1" ] && echo success || echo failure)
          curl -sS -X POST "${INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${{ env.RUN_ID }}",
            "scenario_id": "s1",
            "stage": "s1_health",
            "mode": "${{ env.MODE }}",
            "status": "${STATUS}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T_START},
            "t_end": ${T_END},
            "metrics": {
              "healthy": ${OK},
              "last_code": "${LAST_CODE}"
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${{ github.ref_name }}"
            }
          }
          EOF
          if [[ "$OK" != "1" ]]; then exit 1; fi

      # --- End timer (TTD end) ------------------------------------------------
      - name: End timer
        id: t1
        if: always()
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      # --- Final metrics event (overall) --------------------------------------
      - name: "Send metrics: final (overall)"
        if: always()
        run: |
          set -euo pipefail
          T0=${{ steps.t0.outputs.ts }}
          T1=${{ steps.t1.outputs.ts }}
          STATUS="${{ job.status }}"
          DUR=$(( T1 - T0 ))
          curl -sS -X POST "${INGEST_URL}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -d @- <<EOF
          {
            "run_id": "${{ env.RUN_ID }}",
            "scenario_id": "s1",
            "stage": "s1_final",
            "mode": "${{ env.MODE }}",
            "status": "${STATUS}",
            "commit_sha": "${{ github.sha }}",
            "t_start": ${T0},
            "t_end": ${T1},
            "metrics": {
              "ttd_sec": ${DUR}
            },
            "labels": {
              "service": "${SERVICE}",
              "env": "${ENV}",
              "branch": "${{ github.ref_name }}"
            }
          }
          EOF

      # --- Summary (human-readable headline in the Job UI) --------------------
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          DUR=$(( ${{ steps.t1.outputs.ts }} - ${{ steps.t0.outputs.ts }} ))
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --platform managed --format='value(status.url)')" || URL="<unknown>"
          {
            echo "### S1 Baseline Run"
            echo "- Status: ${{ job.status }}"
            echo "- Service URL: ${URL}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Full TTD (sec): $DUR"
            echo "- Image: $IMAGE"
            echo "- Health: ${{ steps.health_check.outputs.healthy || '<n/a>' }}"
            echo "- Scenario: ${{ env.SCENARIO_ID }} | Branch: ${{ env.BRANCH }} | Env: ${{ env.RUN_ENV }}"
          } >> "$GITHUB_STEP_SUMMARY"
