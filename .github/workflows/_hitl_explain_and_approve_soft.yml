name: HITL Explain + Approve (Soft Gate via Issue, Reusable)

on:
  workflow_call:
    inputs:
      scenario_id:
        type: string
        required: false
        default: ss2
      mode:
        type: string
        required: false
        default: baseline
      run_id:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      case_id:
        type: string
        required: true
      action:
        type: string
        required: true
      recommendation:
        type: string
        required: true
      decision:
        type: string
        required: true
      risk_score:
        type: number
        required: true
      risk_level:
        type: string
        required: true
      rationale:
        type: string
        required: true
      inputs_json:
        type: string
        required: false
        default: "{}"
      outputs_json:
        type: string
        required: false
        default: "{}"
      evidence_json:
        type: string
        required: false
        default: "[]"
      policy_refs_json:
        type: string
        required: false
        default: "[]"
      metrics_ingest_url:
        type: string
        required: false
        default: ""
      approvers_csv:
        description: "Comma-separated GitHub usernames allowed to approve/reject (default: workflow actor)."
        type: string
        required: false
        default: ""
      approval_timeout_min:
        description: "Max minutes to wait for approval (default: 60)."
        type: number
        required: false
        default: 60
      approval_poll_sec:
        description: "Polling interval seconds for checking issue comments (default: 20)."
        type: number
        required: false
        default: 20
    outputs:
      al_sec:
        value: ${{ jobs.final.outputs.al_sec }}
      acr:
        value: ${{ jobs.final.outputs.acr }}
      approval_issue_url:
        value: ${{ jobs.approve.outputs.approval_issue_url }}

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  explain:
    runs-on: self-hosted
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auth to GCP (for ingest token)
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve ingest token
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-identity-token \
            --audiences="${{ inputs.metrics_ingest_url }}" \
            --impersonate-service-account="${{ vars.GCP_SA_APP_EMAIL }}")"
          echo "ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - id: meta
        run: |
          set -euo pipefail
          echo "artifact_name=hitl_${{ inputs.run_id }}_preapprove" >> "$GITHUB_OUTPUT"

      - name: Build cases.json
        run: |
          set -euo pipefail
          mkdir -p baseline/metrics/hitl
          python - <<'PY'
          import json
          case = {
              "case_id": json.loads(r'''${{ toJson(inputs.case_id) }}'''),
              "action": json.loads(r'''${{ toJson(inputs.action) }}'''),
              "recommendation": json.loads(r'''${{ toJson(inputs.recommendation) }}'''),
              "decision": json.loads(r'''${{ toJson(inputs.decision) }}'''),
              "risk": {
                  "score": float(json.loads(r'''${{ toJson(inputs.risk_score) }}''')),
                  "level": json.loads(r'''${{ toJson(inputs.risk_level) }}'''),
              },
              "rationale": json.loads(r'''${{ toJson(inputs.rationale) }}'''),
              "inputs": json.loads(r'''${{ inputs.inputs_json }}'''),
              "outputs": json.loads(r'''${{ inputs.outputs_json }}'''),
              "evidence": json.loads(r'''${{ inputs.evidence_json }}'''),
              "policy_refs": json.loads(r'''${{ inputs.policy_refs_json }}'''),
          }
          json.dump([case], open("baseline/metrics/hitl/cases.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

      - name: Generate explanation + ActionTrace
        env:
          METRICS_INGEST_URL: ${{ inputs.metrics_ingest_url }}
        run: |
          set -euo pipefail
          python baseline/scripts/s5_explainability_runner.py \
            --stage explain \
            --outdir baseline/metrics/hitl \
            --run-id "${{ inputs.run_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --scenario-id "${{ inputs.scenario_id }}" \
            --mode "${{ inputs.mode }}" \
            --cases-file baseline/metrics/hitl/cases.json \
            --ingest-url "${METRICS_INGEST_URL:-}" \
            --auth-token "${ID_TOKEN:-}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: baseline/metrics/hitl

  approve:
    runs-on: self-hosted
    needs: [explain]
    outputs:
      approval_issue_url: ${{ steps.issue.outputs.issue_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auth to GCP (for ingest token)
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve ingest token
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-identity-token \
            --audiences="${{ inputs.metrics_ingest_url }}" \
            --impersonate-service-account="${{ vars.GCP_SA_APP_EMAIL }}")"
          echo "ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.explain.outputs.artifact_name }}
          path: baseline/metrics/hitl

      - id: issue
        name: Create approval issue
        uses: actions/github-script@v7
        with:
          script: |
            const approversCsv = String(JSON.parse(`${{ toJson(inputs.approvers_csv) }}`) || '').trim();
            const defaultApprover = context.actor; // fallback if inputs.approvers_csv is empty
            const approvers = (approversCsv ? approversCsv.split(',') : [defaultApprover])
              .map(s => s.trim())
              .filter(Boolean);

            const scenarioId = String(JSON.parse(`${{ toJson(inputs.scenario_id) }}`) || 'ss2');
            const runId = String(JSON.parse(`${{ toJson(inputs.run_id) }}`) || '');
            const caseId = String(JSON.parse(`${{ toJson(inputs.case_id) }}`) || '');
            const action = String(JSON.parse(`${{ toJson(inputs.action) }}`) || '');
            const recommendation = String(JSON.parse(`${{ toJson(inputs.recommendation) }}`) || '');
            const decision = String(JSON.parse(`${{ toJson(inputs.decision) }}`) || '');
            const riskLevel = String(JSON.parse(`${{ toJson(inputs.risk_level) }}`) || '');
            const riskScore = Number(`${{ inputs.risk_score }}`); // numeric input
            const rationale = String(JSON.parse(`${{ toJson(inputs.rationale) }}`) || '');

            const title = `[HITL] ${scenarioId} approve: ${caseId} (${runId})`;
            const body = [
              `**Scenario:** \`${scenarioId}\``,
              `**Run:** \`${runId}\``,
              `**Case:** \`${caseId}\``,
              `**Action:** \`${action}\``,
              `**Recommendation:** \`${recommendation}\``,
              `**Decision:** \`${decision}\``,
              `**Risk:** \`${riskLevel}\` (score=${riskScore})`,
              ``,
              `**Rationale:** ${rationale}`,
              ``,
              `Allowed approvers: ${approvers.map(a => `@${a}`).join(', ')}`,
              ``,
              `Comment \`approve\` (or \`/approve\`) to continue, or \`reject\` (or \`/reject\`) to fail the run.`,
              ``,
              `_Note: This repo runs on GitHub Free + private, so Environment required reviewers are unavailable. This issue-based gate provides a reproducible, auditable soft-HITL control._`,
            ].join('\n');

            const resp = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['hitl', scenarioId],
            });

            core.setOutput('issue_number', String(resp.data.number));
            core.setOutput('issue_url', resp.data.html_url);

      - name: Wait for approval comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const timeoutMin = Number(`${{ inputs.approval_timeout_min }}`);
            const pollSec = Number(`${{ inputs.approval_poll_sec }}`);

            const approversCsv = String(JSON.parse(`${{ toJson(inputs.approvers_csv) }}`) || '').trim();
            const defaultApprover = context.actor;
            const approvers = new Set((approversCsv ? approversCsv.split(',') : [defaultApprover])
              .map(s => s.trim())
              .filter(Boolean)
              .map(s => s.toLowerCase()));

            const started = Date.now();
            const deadline = started + timeoutMin * 60 * 1000;

            async function sleep(ms) {
              return new Promise(resolve => setTimeout(resolve, ms));
            }

            core.info(`Waiting for approval on issue #${issueNumber} for up to ${timeoutMin} min (poll ${pollSec}s).`);
            core.info(`Allowed approvers: ${Array.from(approvers).join(', ')}`);

            while (Date.now() < deadline) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });

              for (const c of comments.reverse()) {
                const author = (c.user?.login || '').toLowerCase();
                if (!approvers.has(author)) continue;

                const text = (c.body || '').trim().toLowerCase();
                if (['approve', '/approve'].includes(text)) {
                  core.info(`Approved by @${c.user.login}.`);
                  return;
                }
                if (['reject', '/reject'].includes(text)) {
                  throw new Error(`Rejected by @${c.user.login}.`);
                }
              }

              await sleep(pollSec * 1000);
            }

            throw new Error(`Approval timeout after ${timeoutMin} minutes (issue #${issueNumber}).`);

      - name: Stamp approval timestamp
        env:
          METRICS_INGEST_URL: ${{ inputs.metrics_ingest_url }}
        run: |
          set -euo pipefail
          python baseline/scripts/s5_explainability_runner.py \
            --stage approved \
            --outdir baseline/metrics/hitl \
            --run-id "${{ inputs.run_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --scenario-id "${{ inputs.scenario_id }}" \
            --mode "${{ inputs.mode }}" \
            --ingest-url "${METRICS_INGEST_URL:-}" \
            --auth-token "${ID_TOKEN:-}"

      - name: Close approval issue
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            // Best-effort: comment + close the issue so the audit trail is self-contained.
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Automation closing this HITL gate (job status: **${conclusion}**).`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
            });

      - uses: actions/upload-artifact@v4
        with:
          name: hitl_${{ inputs.run_id }}_postapprove
          path: baseline/metrics/hitl

  final:
    runs-on: self-hosted
    needs: [approve]
    outputs:
      al_sec: ${{ steps.out.outputs.al_sec }}
      acr: ${{ steps.out.outputs.acr }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auth to GCP (for ingest token)
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve ingest token
        if: ${{ inputs.metrics_ingest_url != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-identity-token \
            --audiences="${{ inputs.metrics_ingest_url }}" \
            --impersonate-service-account="${{ vars.GCP_SA_APP_EMAIL }}")"
          echo "ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: hitl_${{ inputs.run_id }}_postapprove
          path: baseline/metrics/hitl

      - name: Finalize AL + ACR
        env:
          METRICS_INGEST_URL: ${{ inputs.metrics_ingest_url }}
        run: |
          set -euo pipefail
          python baseline/scripts/s5_explainability_runner.py \
            --stage final \
            --outdir baseline/metrics/hitl \
            --run-id "${{ inputs.run_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --scenario-id "${{ inputs.scenario_id }}" \
            --mode "${{ inputs.mode }}" \
            --ingest-url "${METRICS_INGEST_URL:-}" \
            --auth-token "${ID_TOKEN:-}"

      - id: out
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          s = json.load(open("baseline/metrics/hitl/results.json", "r", encoding="utf-8"))["summary"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"al_sec={s['al_sec']}\n")
              f.write(f"acr={s['acr']}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hitl_${{ inputs.run_id }}
          path: baseline/metrics/hitl
