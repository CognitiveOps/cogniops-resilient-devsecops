name: HITL Explain + Approve (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
        default: hitl-approval
      scenario_id:
        type: string
        required: false
        default: ss2
      mode:
        type: string
        required: false
        default: baseline
      run_id:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      case_id:
        type: string
        required: true
      action:
        type: string
        required: true
      recommendation:
        type: string
        required: true
      decision:
        type: string
        required: true
      risk_score:
        type: number
        required: true
      risk_level:
        type: string
        required: true
      rationale:
        type: string
        required: true
      inputs_json:
        type: string
        required: false
        default: "{}"
      outputs_json:
        type: string
        required: false
        default: "{}"
      evidence_json:
        type: string
        required: false
        default: "[]"
      policy_refs_json:
        type: string
        required: false
        default: "[]"
      metrics_ingest_url:
        type: string
        required: false
        default: ""
    outputs:
      al_sec:
        value: ${{ jobs.final.outputs.al_sec }}
      acr:
        value: ${{ jobs.final.outputs.acr }}

permissions:
  contents: read
  id-token: write

jobs:
  explain:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: meta
        run: |
          set -euo pipefail
          echo "artifact_name=hitl_${{ inputs.run_id }}_preapprove" >> "$GITHUB_OUTPUT"

      - name: Build cases.json
        run: |
          set -euo pipefail
          mkdir -p baseline/metrics/hitl
          python - <<'PY'
          import json
          case = {
              "case_id": json.loads(r'''${{ toJson(inputs.case_id) }}'''),
              "action": json.loads(r'''${{ toJson(inputs.action) }}'''),
              "recommendation": json.loads(r'''${{ toJson(inputs.recommendation) }}'''),
              "decision": json.loads(r'''${{ toJson(inputs.decision) }}'''),
              "risk": {
                  "score": float(json.loads(r'''${{ toJson(inputs.risk_score) }}''')),
                  "level": json.loads(r'''${{ toJson(inputs.risk_level) }}'''),
              },
              "rationale": json.loads(r'''${{ toJson(inputs.rationale) }}'''),
              "inputs": json.loads(r'''${{ inputs.inputs_json }}'''),
              "outputs": json.loads(r'''${{ inputs.outputs_json }}'''),
              "evidence": json.loads(r'''${{ inputs.evidence_json }}'''),
              "policy_refs": json.loads(r'''${{ inputs.policy_refs_json }}'''),
          }
          json.dump([case], open("baseline/metrics/hitl/cases.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

      - name: Generate explanation + ActionTrace
        env:
          METRICS_INGEST_URL: ${{ inputs.metrics_ingest_url }}
        run: |
          set -euo pipefail
          python baseline/scripts/s5_explainability_runner.py \
            --stage explain \
            --outdir baseline/metrics/hitl \
            --run-id "${{ inputs.run_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --scenario-id "${{ inputs.scenario_id }}" \
            --mode "${{ inputs.mode }}" \
            --cases-file baseline/metrics/hitl/cases.json \
            --ingest-url "${METRICS_INGEST_URL:-}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: baseline/metrics/hitl

  approve:
    runs-on: ubuntu-latest
    needs: [explain]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.explain.outputs.artifact_name }}
          path: baseline/metrics/hitl

      - name: Stamp approval timestamp
        env:
          METRICS_INGEST_URL: ${{ inputs.metrics_ingest_url }}
        run: |
          set -euo pipefail
          python baseline/scripts/s5_explainability_runner.py \
            --stage approved \
            --outdir baseline/metrics/hitl \
            --run-id "${{ inputs.run_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --scenario-id "${{ inputs.scenario_id }}" \
            --mode "${{ inputs.mode }}" \
            --ingest-url "${METRICS_INGEST_URL:-}"

      - uses: actions/upload-artifact@v4
        with:
          name: hitl_${{ inputs.run_id }}_postapprove
          path: baseline/metrics/hitl

  final:
    runs-on: ubuntu-latest
    needs: [approve]
    outputs:
      al_sec: ${{ steps.out.outputs.al_sec }}
      acr: ${{ steps.out.outputs.acr }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: hitl_${{ inputs.run_id }}_postapprove
          path: baseline/metrics/hitl

      - name: Finalize AL + ACR
        env:
          METRICS_INGEST_URL: ${{ inputs.metrics_ingest_url }}
        run: |
          set -euo pipefail
          python baseline/scripts/s5_explainability_runner.py \
            --stage final \
            --outdir baseline/metrics/hitl \
            --run-id "${{ inputs.run_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --scenario-id "${{ inputs.scenario_id }}" \
            --mode "${{ inputs.mode }}" \
            --ingest-url "${METRICS_INGEST_URL:-}"

      - id: out
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          s = json.load(open("baseline/metrics/hitl/results.json", "r", encoding="utf-8"))["summary"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"al_sec={s['al_sec']}\n")
              f.write(f"acr={s['acr']}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hitl_${{ inputs.run_id }}
          path: baseline/metrics/hitl
