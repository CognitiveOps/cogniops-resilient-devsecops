# admin - Terraform Apply workflow for GCP infrastructure
# This workflow runs on push to infra-related paths or manually via workflow_dispatch.
# It plans and (optionally) applies Terraform changes, stores state in a GCS bucket,
# and writes important outputs back to repository variables.

name: admin - Terraform Apply (GCP infra)

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Run plan only (no apply)"
        required: false
        default: "false"
  push:
    # Trigger only when infra code or this workflow changes (and functions/ingest)
    paths:
      - "infra/**"
      - ".github/workflows/infra_apply.yml"
      - "functions/ingest/**"

# Minimal repository permissions required by this job (principle of least privilege).
permissions:
  id-token: write    # needed for Workload Identity Federation (WIF)
  contents: write     # write repository contents
  actions: write     # to write repo-level variables later

concurrency:
  # Ensure only one run per ref (branch/PR) is active; prevents concurrent infra changes.
  group: "infra-${{ github.ref }}"
  cancel-in-progress: false

env:
  # Environment defaults and mappings to repository/organization variables.
  PROJECT_ID:        ${{ vars.GCP_PROJECT_ID }}
  REGION:            ${{ vars.GCP_REGION }}
  REPO_LOCATION:     ${{ vars.GCP_REPO_LOCATION || 'europe' }}
  BUCKET_LOCATION:   ${{ vars.GCP_BUCKET_LOCATION || 'EU' }}
  BIGQUERY_LOCATION: ${{ vars.GCP_BIGQUERY_LOCATION || 'EU' }}
  GITHUB_REPO:       ${{ github.repository }}
  TF_STATE_BUCKET:   ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_PREFIX:   "terraform/state"
  BOOTSTRAP_SA_EMAIL: ${{ vars.GCP_SA_BOOTSTRAP_EMAIL || '' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:           # job-level perms override top-level if present; specify explicitly
      id-token: write
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        # Checkout the repository so Terraform configuration in infra/ is available.

      # Authenticate to GCP using Workload Identity Federation if provider and SA are configured.
      - name: Auth to GCP (WIF)
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_INFRA_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_INFRA_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      # Fallback: authenticate using a service account JSON key for bootstrap runs.
      - name: Auth to GCP (bootstrap JSON)
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_SA_INFRA_EMAIL == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        # Ensures gcloud CLI is available for bucket and API management commands.

      - name: Pre-enable core APIs (CRM & Service Usage)
        # Only when bootstrapping with JSON creds
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_SA_INFRA_EMAIL == '' }}
        run: |
          set -euo pipefail
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            --project "$PROJECT_ID"
          # tiny wait so they show up as enabled
          for i in {1..5}; do
            gcloud services list --enabled --project "$PROJECT_ID" \
              | grep -q cloudresourcemanager.googleapis.com && break || sleep 3
          done

      - name: Ensure TF state bucket (must exist before init)
        if: ${{ env.TF_STATE_BUCKET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Project: $PROJECT_ID"
          echo "Bucket : gs://${TF_STATE_BUCKET}"
          # Check if bucket exists; if not, create with uniform access and enable versioning.
          if gcloud storage buckets describe "gs://${TF_STATE_BUCKET}" --format='value(name)' >/dev/null 2>&1; then
            echo "✅ Bucket already exists"
          else
            gcloud storage buckets create "gs://${TF_STATE_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${BUCKET_LOCATION}" \
              --uniform-bucket-level-access
            gcloud storage buckets update "gs://${TF_STATE_BUCKET}" --versioning
            echo "✅ Created bucket gs://${TF_STATE_BUCKET}"
          fi

      - name: Ensure bucket IAM for bootstrap SA
        if: ${{ env.TF_STATE_BUCKET != '' && env.BOOTSTRAP_SA_EMAIL != '' }}
        run: |
          set -euo pipefail
          # Grant storage.objectAdmin to the bootstrap SA so it can manage state objects during first runs.
          echo "Granting objectAdmin to $BOOTSTRAP_SA_EMAIL on gs://$TF_STATE_BUCKET"
          gcloud storage buckets add-iam-policy-binding "gs://${TF_STATE_BUCKET}" \
            --member="serviceAccount:${BOOTSTRAP_SA_EMAIL}" \
            --role="roles/storage.objectAdmin" || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4
        # Installs Terraform CLI used for init/plan/apply.

      - name: Terraform Init
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          # If a remote GCS backend is specified via TF_STATE_BUCKET, write a backend override
          # so terraform init will configure the GCS backend dynamically.
          if [[ -n "${TF_STATE_BUCKET:-}" ]]; then
          cat > backend_override.tf <<EOF
          terraform {
            backend "gcs" {
              bucket = "${TF_STATE_BUCKET}"
              prefix = "${TF_STATE_PREFIX}"
            }
          }
          EOF
            echo "✅ Wrote backend_override.tf"
            cat backend_override.tf
          fi
          # Initialize modules/providers and the backend.
          terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infra
        env:
          # Map environment variables into TF_VAR_* for use in Terraform modules.
          TF_VAR_project_id:        ${{ env.PROJECT_ID }}
          TF_VAR_region:            ${{ env.REGION }}
          TF_VAR_repo_location:     ${{ env.REPO_LOCATION }}
          TF_VAR_bucket_location:   ${{ env.BUCKET_LOCATION }}
          TF_VAR_bigquery_location: ${{ env.BIGQUERY_LOCATION }}
          TF_VAR_github_repo:       ${{ env.GITHUB_REPO }}
          TF_VAR_bootstrap_sa_email: ${{ env.BOOTSTRAP_SA_EMAIL }}
        run: terraform plan -input=false -no-color
        # Produces a plan; subsequent step applies it unless plan_only is true.

      - name: Terraform Apply
        if: ${{ github.event.inputs.plan_only != 'true' }}
        working-directory: infra
        env:
          TF_VAR_project_id:        ${{ env.PROJECT_ID }}
          TF_VAR_region:            ${{ env.REGION }}
          TF_VAR_repo_location:     ${{ env.REPO_LOCATION }}
          TF_VAR_bucket_location:   ${{ env.BUCKET_LOCATION }}
          TF_VAR_bigquery_location: ${{ env.BIGQUERY_LOCATION }}
          TF_VAR_github_repo:       ${{ env.GITHUB_REPO }}
          TF_VAR_bootstrap_sa_email: ${{ env.BOOTSTRAP_SA_EMAIL }}
        run: terraform apply -auto-approve -input=false
        # Apply the planned changes. Skipped when plan_only input equals "true".

      - name: Read Terraform outputs
        id: tfout
        working-directory: infra
        run: |
          # Ensure jq is available to parse JSON outputs.
          sudo apt-get update >/dev/null 2>&1 && sudo apt-get install -y jq >/dev/null 2>&1
          OUT=$(terraform output -json)
          echo "$OUT" > tf_outputs.json
          # Extract useful outputs and write them to $GITHUB_OUTPUT for later steps.
          echo "wif_provider=$(jq -r '.workload_identity_provider_name.value' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "sa_infra=$(jq -r '.gha_infra_sa_email.value' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "sa_app=$(jq -r '.gha_app_sa_email.value' tf_outputs.json)" >> $GITHUB_OUTPUT
          echo "metrics_url=$(jq -r '.metrics_function_url.value' tf_outputs.json)" >> $GITHUB_OUTPUT

      - name: Upsert repository variables
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}  # PAT with repo admin/maintain
          script: |
            const varsToSet = {
              GCP_PROJECT_ID:        process.env.PROJECT_ID || '',
              GCP_REGION:            process.env.REGION || '',
              GCP_REPO_LOCATION:     process.env.REPO_LOCATION || '',
              GCP_BUCKET_LOCATION:   process.env.BUCKET_LOCATION || '',
              GCP_BIGQUERY_LOCATION: process.env.BIGQUERY_LOCATION || '',
              TF_STATE_BUCKET:       process.env.TF_STATE_BUCKET || '',
              GCP_WIF_PROVIDER:      '${{ steps.tfout.outputs.wif_provider }}',
              GCP_SA_INFRA_EMAIL:    '${{ steps.tfout.outputs.sa_infra }}',
              GCP_SA_APP_EMAIL:      '${{ steps.tfout.outputs.sa_app }}',
              METRICS_INGEST_URL:    '${{ steps.tfout.outputs.metrics_url }}'
            };

            for (const [name, value] of Object.entries(varsToSet)) {
              if (!value || value === 'null') { core.info(`Skip empty ${name}`); continue; }
              try {
                // Try CREATE
                await github.request('POST /repos/{owner}/{repo}/actions/variables', {
                  owner: context.repo.owner, repo: context.repo.repo, name, value
                });
                core.info(`Created repository variable: ${name}`);
              } catch (e) {
                if (e.status === 409) {
                  // Already exists → UPDATE
                  await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                    owner: context.repo.owner, repo: context.repo.repo, name, value
                  });
                  core.info(`Updated repository variable: ${name}`);
                } else {
                  core.error(`Failed ${name}: ${e.status} ${e.message}`);
                  throw e;
                }
              }
            }

      - name: Summary
        run: |
          # Append a short summary of key outputs to the job summary for quick inspection.
          {
            echo "### Terraform Outputs → Repo Variables"
            echo "- GCP_WIF_PROVIDER   = ${{ steps.tfout.outputs.wif_provider }}"
            echo "- GCP_SA_INFRA_EMAIL = ${{ steps.tfout.outputs.sa_infra }}"
            echo "- GCP_SA_APP_EMAIL   = ${{ steps.tfout.outputs.sa_app }}"
            echo "- METRICS_INGEST_URL = ${{ steps.tfout.outputs.metrics_url }}"
          } >> $GITHUB_STEP_SUMMARY
