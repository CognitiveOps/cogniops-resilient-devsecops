name: S5 Human-in-the-Loop
on:
  workflow_dispatch:
jobs:
  approval:
    runs-on: ubuntu-latest
    environment: prod   # has required reviewers
    steps:
      - uses: actions/checkout@v4
      - name: Wait for manual approval (via environment protection)
        run: echo "Pending approval in prod environment"

  capture-rationale:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture rationale & latency
        env:
          REASON: "${{ inputs.reason || 'N/A' }}"
        run: |
          python scripts/capture_approval.py --reason "$REASON" \
            --outfile metrics/s5_approvals.csv
      - uses: actions/upload-artifact@v4
        with:
          name: s5_approvals
          path: metrics/s5_approvals.csv
