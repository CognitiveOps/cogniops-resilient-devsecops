name: Runtime Agent — Test, Build, Bundle & Deploy

on:
  push:
    branches: [runtime_agent_dev, design_time_agent_dev, main]
    paths:
      - "runtime-agent/**"
      - "security/policies/**"
      - "config/**"
      - ".github/workflows/runtime_agent_deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_LOCATION: ${{ vars.GCP_REPO_LOCATION || 'europe' }}
  AR_REPO: "apps"
  SERVICE: "runtime-agent"
  CONFIG_BUCKET: "${{ vars.GCP_PROJECT_ID }}-cogniops-config"

concurrency:
  group: runtime-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Run tests ──────────────────────────────────────────────
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r runtime-agent/requirements.txt
      - name: Run tests
        run: cd runtime-agent && python -m pytest tests/ -v

  # ── Job 2: Build & validate OPA bundle, upload config to GCS ──────
  bundle-policies:
    needs: test
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (OIDC/WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install OPA CLI
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/opa

      - name: Validate Rego policies
        run: opa check security/policies/

      - name: Build OPA bundle & upload to GCS
        run: |
          opa build -b security/policies/ -o bundle.tar.gz
          gsutil cp bundle.tar.gz "gs://${CONFIG_BUCKET}/bundles/runtime/bundle.tar.gz"

      - name: Upload control mappings
        run: |
          gsutil cp config/control-mappings.yaml "gs://${CONFIG_BUCKET}/control-mappings/v1.yaml"

  # ── Job 3: Build & push Docker image ──────────────────────────────
  build-push:
    needs: test
    if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_APP_EMAIL != '' }}
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (OIDC/WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REPO_LOCATION}-docker.pkg.dev" --quiet

      - name: Compute image tag
        id: meta
        run: |
          IMAGE="${REPO_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        run: |
          docker build -f runtime-agent/Dockerfile -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  # ── Job 4: Deploy to Cloud Run ────────────────────────────────────
  deploy:
    needs: [build-push, bundle-policies]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Auth to GCP (OIDC/WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy runtime-agent
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: runtime-agent
          region: ${{ env.REGION }}
          image: ${{ needs.build-push.outputs.image }}
          env_vars: |
            COMMIT_SHA=${{ github.sha }}

  # ── Job 5: Smoke test ─────────────────────────────────────────────
  smoke-test:
    needs: deploy
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (OIDC/WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe runtime-agent --region="${REGION}" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Auth with ID token
        id: auth_id
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_APP_EMAIL }}
          token_format: "id_token"
          id_token_audience: ${{ steps.url.outputs.url }}
          id_token_include_email: true

      - name: Health & agent-info checks
        run: |
          URL="${{ steps.url.outputs.url }}"
          TOKEN="${{ steps.auth_id.outputs.id_token }}"
          echo "Runtime agent URL: $URL"

          echo "── Health check ──"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /tmp/health_body.txt -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/health")
            echo "Attempt $i — status: $STATUS"
            cat /tmp/health_body.txt && echo ""
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          [ "$STATUS" = "200" ]

          echo "── Agent info ──"
          curl -s -H "Authorization: Bearer $TOKEN" "$URL/agent/info"
