[pytest]
minversion = 8.0
asyncio_mode = auto

# Each agent package (runtime/design/security) defines its own top-level
# `agent` and `models` packages. Running them together from the repository
# root causes import collisions, so the default invocation only runs the
# evaluation suite. Use `just test-*` (or run pytest inside each agent dir)
# for the agent packages.
testpaths =
    evaluation/test_evaluation
pythonpath = .
addopts =
    -q
    --ignore=Lib
    --ignore=share
    --ignore=3_12_7_venv
    --ignore=.venv
    --ignore=venv
markers =
    integration: marks tests that require external services (GCP, GitHub API, etc.)
    slow: marks tests that are slow to run
