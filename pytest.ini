[pytest]
minversion = 8.0
asyncio_mode = auto
testpaths =
    runtime-agent/tests
    design-agent/tests
    security-agent/tests
    evaluation/tests
    baseline/services/app/tests
    baseline/services/edge_cv_app/tests
    functions/ingest_runs
pythonpath = .
addopts =
    -q
    --ignore=Lib
    --ignore=share
    --ignore=3_12_7_venv
    --ignore=.venv
    --ignore=venv
markers =
    integration: marks tests that require external services (GCP, GitHub API, etc.)
    slow: marks tests that are slow to run
