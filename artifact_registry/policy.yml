# Artifact Registry Cleanup Policy
# 1) Keep last 5 versions/tags per image
# 2) Delete UNTAGGED digests older than 7 days
rules:
  - action: KEEP
    matchVersion:
      versionNamePrefixes: [""]
    mostRecentVersions:
      keepCount: 5
  - action: DELETE
    matchVersion:
      tagStates: ["UNTAGGED"]
    olderThan: "604800s"  # 7 days
